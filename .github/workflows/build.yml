name: Build per-user desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: mac
          - os: ubuntu-22.04
            package: linux
          - os: windows-2022
            package: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Desktop and native IPC smoke tests
        if: runner.os != 'Linux'
        run: |
          npx electron tests/desktop-smoke.cjs
          npx electron tests/main-smoke.cjs
          npx electron tests/history-smoke.cjs
      - name: Sandboxed Linux desktop smoke tests
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a npx electron tests/desktop-smoke.cjs
          dbus-run-session -- xvfb-run -a npx electron tests/main-smoke.cjs
          dbus-run-session -- xvfb-run -a npx electron tests/history-smoke.cjs
      - run: npx electron-builder --${{ matrix.package }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Resolve packaged resources
        run: node scripts/find-resources.mjs
      - name: Verify packaged engine and native app
        if: runner.os != 'Linux'
        run: |
          npx electron scripts/verify-package.cjs
          npx electron tests/main-smoke.cjs
          npx electron tests/history-smoke.cjs
      - name: Verify sandboxed Linux package
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a npx electron scripts/verify-package.cjs
          dbus-run-session -- xvfb-run -a npx electron tests/main-smoke.cjs
          dbus-run-session -- xvfb-run -a npx electron tests/history-smoke.cjs
      - name: Launch actual Linux package
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-launch.mjs release/linux-unpacked/ciq-developer-terminal
      - name: Launch actual macOS package
        if: runner.os == 'macOS'
        run: node scripts/smoke-launch.mjs "release/mac-arm64/CIQ Developer Terminal.app/Contents/MacOS/CIQ Developer Terminal"
      - name: Launch actual Windows package
        if: runner.os == 'Windows'
        run: node scripts/smoke-launch.mjs "release/win-unpacked/CIQ Developer Terminal.exe"
      - name: Verify Windows per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:LOCALAPPDATA 'CIQ-Installer-Smoke'
          $process = Start-Process $setup.FullName -ArgumentList '/S', '/currentuser', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          if (!(Test-Path "$destination/CIQ Developer Terminal.exe")) { throw 'Per-user executable not installed' }
          $env:CIQ_PACKAGE_RESOURCES = "$destination/resources"
          $env:CIQ_PACKAGE_APP_ROOT = "$destination/resources/app.asar"
          npx electron scripts/verify-package.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed engine failed' }
          npx electron tests/main-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed native app failed' }
      - name: Create checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ciq-developer-terminal-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-${{ runner.os }}-${{ runner.arch }}
          path: test-results/*.png
          if-no-files-found: ignore
  debian:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ['12', '13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ciq-developer-terminal-Linux-X64
          path: release
      - name: Build Debian desktop validation image
        run: docker build --build-arg DEBIAN_VERSION=${{ matrix.version }} -f tests/debian/Dockerfile -t ciq-debian-test .
      - name: Run non-root Debian desktop and packaged-launch checks
        # The outer Docker profile must allow nested namespaces. Chromium's
        # renderer sandbox stays enabled and is asserted by the smoke test.
        run: docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined ciq-debian-test
  publish:
    needs: [package, debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ciq-developer-terminal-*
          path: release
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/*.exe release/SHA256SUMS*.txt --verify-tag --title "CIQ Developer Terminal $version" --notes-file "docs/RELEASE-$version.md" --latest
